<style>
:root{--bg:#fffdf0;--card:#fff;--ink:#4a3f35;--sub:#9a8a7f;--yellow:#fbc02d;--yellow2:#fff9c4;--line:#ffe082;

*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:"Noto Sans TC","PingFang TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom));line-height:1.55}
.bow{width:46px;height:30px;display:block;margin:0 auto 4px}
.wrap{padding:0 14px;max-width:560px;margin:0 auto}
.days{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;scrollbar-width:none}
.days button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:6px 14px;font:inherit;font-size:13px;text-align:center;cursor:pointer}
.days button b{display:block;font-size:15px}
.days button.on{background:var(--yellow);border-color:var(--yellow);color:#fff}

.it{background:var(--card);border-radius:18px;padding:12px 14px 12px 16px;margin-bottom:12px;border-left:6px solid var(--c);box-shadow:0 2px 10px #fbc02d26}

.kind{font-size:12px;color:var(--sub)}
.it h3{font-size:16px;font-weight:600}
.kr{color:var(--sub);font-size:13px}

.note{font-size:12px;color:var(--sub);text-align:center;margin:14px 0}

nav.bar button{flex:1;border:0;background:none;padding:10px 0 8px;font:inherit;font-size:12px;color:var(--sub);cursor:pointer}
nav.bar button span{display:block;font-size:20px}
nav.bar button.on{color:var(--orderc);font-weight:600}
.box{background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px #fbc02d26}
.box h3{font-size:15px;margin-bottom:8px}
label{display:block;font-size:12px;color:var(--sub);margin-top:8px}
input,textarea,select{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
textarea{resize:vertical;min-height:44px}
.row{display:flex;gap:8px}.row>*{flex:1}
.go{border:0;background:var(--yellow);color:#fff;border-radius:12px;padding:9px 14px;font:inherit;font-size:14px;font-weight:600;margin-top:10px;width:100%;cursor:pointer}
.go.gray{background:var(--yellow2);color:var(--ink)}
.sum{display:flex;justify-content:space-between;font-size:14px;padding:3px 0}

.ex{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}

.hb{display:flex;gap:8px;justify-content:center;margin:8px 0}
.hb button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:5px 14px;font:inherit;font-size:13px;cursor:pointer}
.st{font-size:12px;color:var(--sub);text-align:center}
.ed{display:flex;gap:6px;margin-top:8px}.ed button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:3px 10px;font:inherit;font-size:12px;cursor:pointer}
#md{position:fixed;inset:0;background:#4a3f3566;z-index:20;display:flex;align-items:flex-end}
#md[hidden]{display:none}
.mc{background:var(--card);width:100%;max-height:90vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--yellow2);border-radius:14px;padding:3px 12px 3px 6px;margin:0 6px 6px 0;font-size:14px}
.ck{display:inline-flex;align-items:center;gap:4px;margin:4px 12px 0 0;font-size:14px;color:var(--ink)}
.ck input{width:auto}
#list>.go{margin-bottom:12px}
.hero{text-align:center;padding:24px 16px 8px}
.hero h1{font-size:24px;font-weight:700;letter-spacing:.05em;margin:2px 0}
.hero .sub{color:var(--sub);font-size:13px}
.stage{position:relative;margin:14px auto 10px;display:flex;justify-content:center;align-items:flex-end;gap:10px;background:var(--yellow2);border-radius:28px;padding:44px 8px 16px;max-width:480px;overflow:hidden}
.wk{position:relative;display:inline-block;animation:bob .6s step-end infinite}
.wk .f1,.wk .f2{display:block}.wk .f2{position:absolute;left:0;top:0}
.wk .f1{animation:fa .6s step-end infinite}.wk .f2{animation:fb .6s step-end infinite}
@keyframes fa{0%{opacity:1}50%{opacity:0}}
@keyframes fb{0%{opacity:0}50%{opacity:1}}
@keyframes bob{0%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.stage::after{content:"";position:absolute;left:0;right:0;bottom:0;height:8px;background:repeating-linear-gradient(90deg,#fbc02d 0 14px,transparent 14px 28px);animation:road .6s linear infinite}
@keyframes road{to{background-position:-28px 0}}
.stage::before{content:"";position:absolute;left:0;right:0;bottom:8px;height:34px;background:#ffe082;clip-path:polygon(0 100%,0 62%,12% 62%,12% 38%,28% 38%,28% 18%,46% 18%,46% 44%,62% 44%,62% 28%,82% 28%,82% 56%,100% 56%,100% 100%)}
.cd{display:flex;justify-content:center;gap:8px;margin:10px 0 16px}
.cd div{background:var(--card);border-radius:16px;min-width:64px;padding:8px 4px;box-shadow:0 2px 10px #fbc02d26}
.cd b{display:block;font-size:26px;color:var(--orderc);font-variant-numeric:tabular-nums}.cd small{font-size:11px;color:var(--sub)}
.cdt{font-size:15px;font-weight:600;margin-top:14px}
.deco{display:flex;justify-content:center;align-items:flex-end;gap:12px;margin:6px 0 12px}
.dh{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}.it.drag{opacity:.75;box-shadow:0 8px 22px #0003}.hb{margin:4px 0 10px}.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom));background:#4a3f35;color:#fff;font-size:13px;padding:8px 14px;border-radius:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90%;text-align:center}.toast.on{opacity:1}</style>
</head>

const F3=["...HHHHHH...","..HHHHHHHH..",".HHHHHHHHHH.",".HHHHHHHHHH.",".HHSSSSSSHH.",".HHSESSESHH.",".HHSCSSCSHH.",".HHSSMMSSHH..","HHHHSSSSHHHH","HHSDDDDDDSHH","HHSDDDDDDSHH","DDDDDDDDDDDD","DDDDDDDDDDDD","...SS..SS...","...SS..SS...","..WWW.WWW..."];
const M0=["...HHHHHH...","..HHHHHHHH..",".HHHHHHHHHH.",".HHHHHHHHHH.","...SSSSSS...","..SESSES....","..SCSSCS....","..SSMMSS....","...SSSSSS...","..SBBBBBBS..","..SBBBBBBS..",".SBBBBBBBS..","..PPPPPPPP..","..PP....PP..","..PP....PP..","..WWW..WWW.."];
const M1=["..H..HH..H..","..HHHHHHHH..",".HHHHHHHHHH.",".HHHHHHHHHH.","...SSSSSS...","..SESSES....","..SCSSCS....","..SSMMSS....","...SSSSSS...","..SBBBBBBS..","..SBBBBBBS..",".SBBBBBBBS..","..PPPPPPPP..","..PP....PP..","..PP....PP..","..WWW..WWW.."];
const PF=[{H:'#ff4081',B:'#ff80ab',S:'#ffe0cc',E:'#3a2a2a',C:'#ff4081',M:'#e0607e',D:'#ff80ab',W:'#c76b8a'},
{H:'#ff9800',B:'#ffb74d',S:'#ffe0cc',E:'#3a2a2a',C:'#ff9800',M:'#e0607e',D:'#ffb74d',W:'#e65100'},
{H:'#ab47bc',B:'#ce93d8',S:'#ffe0cc',E:'#3a2a2a',C:'#ab47bc',M:'#e0607e',D:'#ce93d8',W:'#6a1b9a'},
{H:'#26a69a',B:'#80cbc4',S:'#ffe0cc',E:'#3a2a2a',C:'#26a69a',M:'#e0607e',D:'#80cbc4',W:'#00695c'}];
const PM=[{H:'#3e2723',B:'#1976d2',S:'#ffe0cc',E:'#1a252f',C:'#1565c0',M:'#0d47a1',P:'#263238',W:'#1565c0'},
{H:'#212121',B:'#0097a7',S:'#ffe0cc',E:'#1a252f',C:'#00838f',M:'#006064',P:'#37474f',W:'#00838f'}];
function getCharData(m){
 if(m.male)return{sprite:m.style===0?M0:M1,palette:PM[m.style===0?0:1]};
 const sp=[F0,F1,F2,F3];return{sprite:sp[m.style]||F0,palette:PF[m.style]||PF[0]}}
function px(m,p,s){let r='';m.forEach((row,y)=>{let x=0;while(x<row.length){const c=row[x];if(c=='.'){x++;continue}let e=x;while(row[e+1]==c)e++;r+=`<rect x="${x}" y="${y}" width="${e-x+1}" height="1" fill="${p[c]}"/>`;x=e+1}});
 return `<svg viewBox="0 0 ${m[0].length} ${m.length}" width="${m[0].length*s}" height="${m.length*s}" shape-rendering="crispEdges">${r}</svg>`}
const wk=(m,s,d)=>{const {sprite,palette}=getCharData(m),b=m.male?'PP':'SS';
 const W1=sprite.slice(0,13).concat([`..${b}...${b}...`,`${b}.....${b}..`,".WWW...WWW.."]);
 const W2=sprite.slice(0,13).concat([`....${b}${b}....`,`....${b}${b}....`,"...WWWWWW..."]);
 return `<span class="wk" style="animation-delay:${d}s"><span class="f1" style="animation-delay:${d}s">${px(W1,palette,s)}</span><span class="f2" style="animation-delay:${d}s">${px(W2,palette,s)}</span></span>`};
const avObj=m=>{const {sprite,palette}=getCharData(m);return px(sprite,palette,2)};
function drawHome(){
 if(q('#stage'))q('#stage').innerHTML=MEMBERS_DEF.map((m,i)=>wk(m,4.2,i*.12)).join('');
 if(q('#deco'))q('#deco').innerHTML=MEMBERS_DEF.map((m,i)=>wk(m,2.5,i*.12)).join('')}

const T0=new Date('2026-12-25T00:00:00+08:00'),T1=new Date('2026-12-28T00:00:00+08:00');
function tick(){const n=new Date(),el=q('#cd');if(!el)return;
 if(n<T0){const d=Math.floor((T0-n)/1000);q('#cdt').textContent='距離高雄出發還有';
  el.innerHTML=[[Math.floor(d/86400),'天'],[Math.floor(d%86400/3600),'時'],[Math.floor(d%3600/60),'分'],[d%60,'秒']].map(a=>`<div><b>${String(a[0]).padStart(2,'0')}</b><small>${a[1]}</small></div>`).join('')}
 else if(n<T1){q('#cdt').textContent='高雄旅遊中 🎉';el.innerHTML=`<div><b>Day ${Math.floor((n-T0)/864e5)+1}</b><small>/ 3</small></div>`}
 else{q('#cdt').textContent='旅程結束，期待下次再見！🎀';el.innerHTML=''}}

/* 行程版本號改為 V4，避免舊的瀏覽器暫存蓋掉新行程 */
let S={days:D0,info:{},members:MEMBERS_DEF,ex:[]};
let pend='',cur=0,edit=false,tmr={},lastKey='',ei=-1;
/* ▼▼ 貼上你的 Firebase Realtime Database 網址（結尾不要加 /），例如 https://xxxx-default-rtdb.firebaseio.com ▼▼ */
const FB_URL='https://newark-251d7-default-rtdb.asia-southeast1.firebasedatabase.app/';
let tt=0,dg=null,last={plan:'',ledger:''};
const setSt=t=>{const e=q('#st');if(!e)return;e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),3000)};
async function wr(w){
 if(!FB_URL){try{localStorage.setItem('S_KH5',JSON.stringify({days:S.days,info:S.info,ex:S.ex}))}catch(e){}setSt('尚未設定資料庫，只存在這支手機');return}
 const body=JSON.stringify(w=='plan'?{days:S.days,info:S.info}:S.ex);last[w]=body;
 try{const r=await fetch(`${FB_URL}/trip/${w}.json`,{method:'PUT',body:JSON.stringify({v:body})});if(!r.ok)throw 0;setSt('✅ 已同步給所有人')}catch(e){setSt('⚠️ 儲存失敗，請檢查網路或資料庫規則')}}
function upd(fn,w='plan'){fn(S);renderAll();wr(w)}
async function pull(){
 if(!FB_URL||dg||!q('#md').hidden||q('#cti'))return;
 for(const w of ['plan','ledger']){try{const r=await fetch(`${FB_URL}/trip/${w}.json`,{cache:'no-store'});if(!r.ok)continue;const j=await r.json();if(!j||!j.v||j.v===last[w])continue;last[w]=j.v;const d=JSON.parse(j.v);
  if(w=='plan'){S.days=d.days;S.info=d.info||{}}else S.ex=Array.isArray(d)?d:[];renderAll()}catch(e){}}}
function initDb(){
 if(!FB_URL){try{const d=JSON.parse(localStorage.getItem('S_KH5')||'null');if(d){S.days=d.days;S.info=d.info||{};S.ex=d.ex||[];renderAll()}}catch(e){}return}
 pull();setInterval(()=>{if(!document.hidden)pull()},5000)}
function renderDays(){const el=q('#days');if(el)el.innerHTML=S.days.map((x,i)=>`<button class="${i==cur?'on':''}" data-i="${i}">${x.d.slice(5).replace('-','/')}<b>${x.w}</b></button>`).join('')}
function renderWx(){const x=S.days[cur],el=q('#wx');
 if(el)el.innerHTML=`<span class="ic">☀️</span><div><b>${esc(x.city)} · 舒適好天氣</b><small>高雄12月均溫約 18°C–24°C，騎機車記得帶薄外套、備好雨衣</small></div>`}
function renderList(){const x=S.days[cur],el=q('#list');if(!el)return;
 const TN={eat:'必吃',order:'必點',buy:'必買',book:'預約'};
 el.innerHTML=`<h2 id="ct">⭐ ${esc(x.city)}${edit?' ✎':''}</h2>`+x.items.map((t,i)=>{
  const tags=(t.tags||[]).map(([c,v])=>`<span class="tag t-${c}">${TN[c]}｜${esc(v)}</span>`).join('');
  const url='https://www.google.com/maps/search/?api=1&query='+enc(t.kr||t.n);
  return `<div class="it ${t.k}" data-i="${i}"><div class="kind">${KN[t.k]} · ${esc(t.time)}</div><h3>${esc(t.n)}</h3><div class="kr">${esc(t.kr)}</div>${tags?`<div class="tags">${tags}</div>`:''}<div class="tip">${rich(t.tip)}</div><a class="nav ${t.k=='move'?'m':''}" href="${url}" target="_blank" rel="noopener">Google Maps 導航</a>${edit?`<div class="ed"><button class="dh">⠿ 按住拖曳</button><button data-a="ed" data-i="${i}">✎ 修改</button><button data-a="rm" data-i="${i}">🗑 刪除</button></div>`:''}</div>`}).join('')
  +(edit?'<button class="go" data-a="add">＋ 新增項目</button>':'')}
function renderInfo(){document.querySelectorAll('[data-k]').forEach(e=>{if(document.activeElement!==e)e.value=S.info[e.dataset.k]??(e.defaultValue||'')})}
function renderMoney(){
 const M=S.members,names=M.map(m=>m.name);
 q('#mem').innerHTML=M.map(m=>`<span class="chip">${avObj(m)}${esc(m.name)}</span>`).join('');
 const key=names.join('|');
 if(key!=lastKey){lastKey=key;
  q('#ep').innerHTML=names.map((n,i)=>`<option value="${i}">${esc(n)}</option>`).join('');
  q('#ew').innerHTML=names.map((n,i)=>`<label class="ck"><input type="checkbox" value="${i}" checked>${esc(n)}</label>`).join('')}
 const paid={},owe={};names.forEach(n=>paid[n]=owe[n]=0);
 S.ex.forEach(x=>{const w=x.w&&x.w.length?x.w:names;paid[x.p]=(paid[x.p]||0)+x.a;w.forEach(n=>owe[n]=(owe[n]||0)+x.a/w.length)});
 q('#bal').innerHTML=names.map((n,i)=>`<div class="sum"><span>${avObj(M[i])}${esc(n)}　已付 ${won(paid[n])}</span><span>應付 ${won(owe[n])}</span></div>`).join('');
 const de=[],cr=[],out=[];names.forEach(n=>{const v=Math.round(paid[n]-owe[n]);if(v<0)de.push([n,-v]);else if(v>0)cr.push([n,v])});
 while(de.length&&cr.length){const t=Math.min(de[0][1],cr[0][1]);out.push([de[0][0],cr[0][0],t]);de[0][1]-=t;cr[0][1]-=t;if(!de[0][1])de.shift();if(!cr[0][1])cr.shift()}
 q('#set').innerHTML=out.length?out.map(o=>`<div class="sum"><b>${esc(o[0])} → ${esc(o[1])}</b><b>${won(o[2])}</b></div>`).join(''):'<p class="kr">目前帳目已平衡，不需要轉帳</p>';
 q('#exl').innerHTML=S.ex.length?S.ex.map(x=>`<div class="ex"><span>${esc(x.c)} · ${esc(x.n)}<br><small class="kr">${esc(x.p)} 先付 · ${(x.w||[]).length==names.length?'6人全員平分':esc((x.w||[]).join('、'))}</small></span><span>${won(x.a)} <button data-d="${x.id}">✕</button></span></div>`).join(''):'<p class="kr">還沒有記帳紀錄。</p>'}
function renderAll(){renderDays();renderWx();renderList();renderInfo();renderMoney()}

function startApp(){
 renderAll();drawHome();tick();setInterval(tick,1000);initDb();
 q('#days').onclick=e=>{const b=e.target.closest('button');if(b){cur=+b.dataset.i;renderAll()}};
 document.querySelectorAll('nav.bar button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav.bar button,section.tab').forEach(n=>n.classList.remove('on'));b.classList.add('on');q('#tab-'+b.dataset.t).classList.add('on');scrollTo(0,0)});
 q('#eb').onclick=()=>{edit=!edit;q('#eb').textContent=edit?'✅ 完成編輯':'✏️ 編輯行程';renderList()};
 q('#list').addEventListener('pointerdown',e=>{const h=e.target.closest('.dh');if(!h)return;e.preventDefault();dg=h.closest('.it');dg.classList.add('drag');try{h.setPointerCapture(e.pointerId)}catch(x){}});
 q('#list').addEventListener('pointermove',e=>{if(!dg)return;
  if(e.clientY<90)scrollBy(0,-12);else if(e.clientY>innerHeight-130)scrollBy(0,12);
  const t=document.elementsFromPoint(e.clientX,e.clientY).map(n=>n.closest&&n.closest('.it[data-i]')).find(n=>n&&n!==dg);
  if(t){const r=t.getBoundingClientRect();t.parentNode.insertBefore(dg,e.clientY<r.top+r.height/2?t:t.nextSibling)}});
 const endDrag=()=>{if(!dg)return;const d=cur,order=[...q('#list').querySelectorAll('.it[data-i]')].map(n=>+n.dataset.i);dg=null;upd(s=>{const L=s.days[d].items;s.days[d].items=order.map(i=>L[i])})};
 q('#list').addEventListener('pointerup',endDrag);q('#list').addEventListener('pointercancel',endDrag);
 function openM(i){ei=i;const t=i<0?{k:'spot',time:'',n:'',kr:'',tags:[],tip:''}:S.days[cur].items[i];
  q('#mk').value=t.k;q('#mtm').value=t.time||'';q('#mn').value=t.n;q('#mkr').value=t.kr||'';q('#mtip').value=t.tip||'';
  ['eat','order','buy','book'].forEach(c=>{const f=(t.tags||[]).find(a=>a[0]==c);q('#tg-'+c).value=f?f[1]:''});q('#md').hidden=false}
 q('#mcancel').onclick=()=>{q('#md').hidden=true};
 q('#msave').onclick=()=>{const it={k:q('#mk').value,time:q('#mtm').value,n:q('#mn').value||'未命名',kr:q('#mkr').value,tip:q('#mtip').value,
  tags:['eat','order','buy','book'].map(c=>[c,q('#tg-'+c).value.trim()]).filter(a=>a[1])};
  q('#md').hidden=true;const d=cur,k=ei;upd(s=>{const L=s.days[d].items;if(k<0)L.push(it);else L[k]=it})};
 q('#list').onclick=e=>{const b=e.target.closest('button');
  if(b&&b.dataset.a){const a=b.dataset.a,i=+b.dataset.i,d=cur;
   if(a=='add')openM(-1);else if(a=='ed')openM(i);
   else if(a=='rm'){if(pend!=d+'-'+i){pend=d+'-'+i;b.textContent='再按一次確認刪除';return}pend='';upd(s=>{s.days[d].items.splice(i,1)})}
   else upd(s=>{const L=s.days[d].items,j=a=='up'?i-1:i+1;if(j>=0&&j<L.length)[L[i],L[j]]=[L[j],L[i]]})}
  else if(e.target.id=='ct'&&edit){const d=cur;q('#ct').outerHTML=`<input id="cti" value="${esc(S.days[d].city)}">`;const n=q('#cti');n.focus();n.onblur=()=>{const v=n.value.trim();if(v&&v!=S.days[d].city)upd(s=>{s.days[d].city=v});else renderList()}}};
 document.querySelectorAll('[data-k]').forEach(e=>e.oninput=()=>{const k=e.dataset.k;clearTimeout(tmr[k]);tmr[k]=setTimeout(()=>upd(s=>{s.info[k]=e.value}),500)});
 q('#add').onclick=()=>{const a=+q('#ea').value;const names=S.members.map(m=>m.name);if(!a||!names.length)return;
  const x={id:Date.now().toString(36),n:q('#ei').value||'未命名',a,c:q('#ec').value,p:names[+q('#ep').value],
   w:[...document.querySelectorAll('#ew input:checked')].map(i=>names[+i.value])};
  q('#ei').value='';q('#ea').value='';upd(s=>{s.ex.unshift(x)},'ledger')};
 q('#exl').onclick=e=>{const id=e.target.dataset.d;if(id)upd(s=>{s.ex=s.ex.filter(x=>x.id!=id)},'ledger')};
 q('#enter').onclick=()=>document.querySelector('nav.bar button[data-t=plan]').click();
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',startApp);else startApp();
</script>
</body>
</html>
